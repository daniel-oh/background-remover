# cargo-deny: what may enter the dependency tree. CI runs `cargo deny check`.
[graph]
all-features = false
no-default-features = true
features = ["dynamic"]

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
allow = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
  "ISC", "Zlib", "0BSD", "Unlicense", "Unicode-3.0", "MPL-2.0", "IJG", "CC0-1.0", "BSL-1.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
