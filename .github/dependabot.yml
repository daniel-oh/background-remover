version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    # One pull request for the week's crates, not one each. Separate ones
    # block each other: when two advisories are open, each update fixes one
    # and fails the audit on the other, so none can merge.
    groups:
      crates:
        patterns: ["*"]
    ignore:
      # Pinned: the static ONNX Runtime binaries are matched to this release.
      - dependency-name: ort
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    ignore:
      # Pinned to a commit of its `stable` branch, which has no releases for
      # Dependabot to follow; it would offer the per-Rust-version branches
      # (1.120 and so on) instead. Raise the commit by hand.
      - dependency-name: dtolnay/rust-toolchain
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
