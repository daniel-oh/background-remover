version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Pinned: the static ONNX Runtime binaries are matched to this release.
      - dependency-name: ort
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Not an action version. `dtolnay/rust-toolchain@1.88` selects the Rust
      # release, and 1.88 is this crate's MSRV (`rust-version` in Cargo.toml).
      # Dependabot reads it as a tag and offers 1.120, which would turn the
      # msrv job into a second copy of the stable build.
      - dependency-name: dtolnay/rust-toolchain
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
