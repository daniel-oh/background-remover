name: Release

# On a version tag: build and push the image to GitHub Container Registry,
# and attach the Linux x86_64 binary to the GitHub release.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Tags
        id: tags
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "tags=$IMAGE:latest,$IMAGE:$VERSION,$IMAGE:sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=MIT OR Apache-2.0
            org.opencontainers.image.description=Background removal as a small HTTP service
          cache-from: type=gha
          cache-to: type=gha,mode=max

  binary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98"
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked
      - name: Package
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          mkdir -p dist
          cp target/release/background-remover dist/
          cp README.md LICENSE-MIT LICENSE-APACHE NOTICE dist/
          tar -C dist -czf "background-remover-$VERSION-x86_64-unknown-linux-gnu.tar.gz" .
          sha256sum "background-remover-$VERSION-x86_64-unknown-linux-gnu.tar.gz" > "background-remover-$VERSION-x86_64-unknown-linux-gnu.tar.gz.sha256"
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            background-remover-*.tar.gz
            background-remover-*.tar.gz.sha256
          generate_release_notes: true
