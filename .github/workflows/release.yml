name: Release

# On a version tag: build the image for linux/amd64 and linux/arm64 on
# native runners, publish one multi-architecture tag on GitHub Container
# Registry, and attach binaries for four platforms to the GitHub release.
#
# The binaries are built in parallel but the release is written ONCE, by the
# `publish` job, one file at a time. GitHub rejects concurrent asset uploads
# to the same release ("Error creating asset temp dir"). Four build jobs
# each running the release action hit that, and with fail-fast one failure
# cancelled the other uploads half way: v0.3.1 went out with two of its
# eight files. So did a single job using that action, which uploads in
# parallel internally. 0.3.0 had simply been lucky.
#
# Run it by hand with a tag to publish that tag again with THIS file rather
# than the one in the tag. Release tags are immutable and a re-run always
# uses the tagged workflow, so this is how a release whose upload failed
# gets finished. The images are left alone in that mode.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      tag:
        description: An existing release tag to build and publish again, e.g. v0.3.1
        required: true
        type: string
      rust:
        description: Rust release to build that tag with, when not the workflow's own (e.g. 1.99)
        required: false
        type: string

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}
  # The tag being released: the pushed one, or the one named by hand.
  TAG: ${{ inputs.tag || github.ref_name }}
  # The Rust release. RUSTUP_TOOLCHAIN makes it win over the tag's own
  # rust-toolchain.toml: a tag is immutable, so when a tag does not build
  # with the Rust it names (v0.4.0 on Windows, Rust 1.100), this is the only
  # way to finish its release.
  RUST: ${{ inputs.rust || '1.100' }}
  RUSTUP_TOOLCHAIN: ${{ inputs.rust || '1.100' }}

jobs:
  image:
    if: github.event_name == 'push'
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=MIT OR Apache-2.0
            org.opencontainers.image.description=Background removal as a small HTTP service
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          # Signed build provenance and a list of what is inside (SBOM),
          # attached to the image so a user can check where it came from.
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,scope=${{ matrix.platform }},mode=max
      - name: The image pushed is this version, and runs
        # Before the tags are written: `manifest` needs this job, so an
        # image that does not answer never becomes `latest`. v0.4.0's did
        # not, and did.
        run: |
          version=$(docker run --rm "$IMAGE@$DIGEST" --version)
          echo "$version"
          test "$version" = "background-remover ${TAG#v}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - name: Build and push the bundled image by digest
        # The same program with isnet-general-use and birefnet-lite-768
        # inside (Dockerfile, target `bundled`), tagged `bundled`.
        id: bundled
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: bundled
          platforms: ${{ matrix.platform }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=MIT OR Apache-2.0
            org.opencontainers.image.description=Background removal as a small HTTP service, with the isnet-general-use and birefnet-lite-768 models built in
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,scope=${{ matrix.platform }},mode=max
      - name: The bundled image is this version, and its models load
        run: |
          version=$(docker run --rm "$IMAGE@$DIGEST" --version)
          test "$version" = "background-remover ${TAG#v}"
          docker run -d --name bundled --read-only -p 127.0.0.1:7001:7000 "$IMAGE@$DIGEST"
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:7001/health >/dev/null && break
            sleep 1
          done
          for model in birefnet-lite-768 isnet-general-use; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 180 \
              --data-binary @testdata/sample.jpg -H 'content-type: image/jpeg' \
              "http://127.0.0.1:7001/remove?model=$model")
            echo "$model: $code"
            test "$code" = 200
          done
        env:
          DIGEST: ${{ steps.bundled.outputs.digest }}
      - name: Keep the digests
        run: |
          mkdir -p digests/slim digests/bundled
          touch "digests/slim/${DIGEST#sha256:}" "digests/bundled/${BUNDLED#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          BUNDLED: ${{ steps.bundled.outputs.digest }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          path: digests/
          if-no-files-found: error
          retention-days: 1

  manifest:
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Publish the multi-architecture tags
        working-directory: digests
        run: |
          VERSION=$TAG
          docker buildx imagetools create \
            -t "$IMAGE:latest" -t "$IMAGE:$VERSION" -t "$IMAGE:sha-${GITHUB_SHA::7}" \
            $(cd slim && printf "$IMAGE@sha256:%s " *)
          docker buildx imagetools create \
            -t "$IMAGE:bundled" -t "$IMAGE:$VERSION-bundled" \
            $(cd bundled && printf "$IMAGE@sha256:%s " *)
          docker buildx imagetools inspect "$IMAGE:$VERSION"
          docker buildx imagetools inspect "$IMAGE:$VERSION-bundled"

  binary:
    strategy:
      # One platform's trouble must not cancel the others mid-flight.
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            # Not a numbered image: GitHub retires those, and v0.3.2's
            # binaries stopped here on "macos-14 is not supported".
            runner: macos-latest
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: ${{ env.RUST }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build
        run: cargo build --release --locked
      - name: The binary is this version, and runs
        shell: bash
        run: |
          version=$(target/release/background-remover --version)
          echo "$version"
          test "$version" = "background-remover ${TAG#v}"
      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          NAME="background-remover-$TAG-${{ matrix.target }}"
          mkdir -p "dist/$NAME"
          cp target/release/background-remover README.md LICENSE-MIT LICENSE-APACHE NOTICE "dist/$NAME/"
          tar -C dist -czf "$NAME.tar.gz" "$NAME"
          shasum -a 256 "$NAME.tar.gz" > "$NAME.tar.gz.sha256"
      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "background-remover-$env:TAG-${{ matrix.target }}"
          New-Item -ItemType Directory -Path "dist/$name" | Out-Null
          Copy-Item target/release/background-remover.exe, README.md, LICENSE-MIT, LICENSE-APACHE, NOTICE "dist/$name/"
          Compress-Archive -Path "dist/$name" -DestinationPath "$name.zip"
          (Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLower() + "  $name.zip" | Out-File -Encoding ascii "$name.zip.sha256"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binary-${{ matrix.target }}
          path: |
            background-remover-*.tar.gz
            background-remover-*.tar.gz.sha256
            background-remover-*.zip
            background-remover-*.zip.sha256
          if-no-files-found: error
          retention-days: 1

  publish:
    # The only job that touches the GitHub release. All four platforms or
    # nothing: a release with files missing is worse than a late one.
    needs: binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: binary-*
          merge-multiple: true
      - name: Eight files, or stop
        run: |
          ls -l dist
          test "$(find dist -type f | wc -l)" -eq 8
      - name: Release, one file at a time
        # Not softprops/action-gh-release: it uploads every file at once, and
        # GitHub answers concurrent asset uploads to one release with "Error
        # creating asset temp dir". Moving to a single job was necessary but
        # not enough; the same error came back from inside the action. `gh`
        # uploads what it is given, so give it one file per call, and retry,
        # because the upload endpoint also fails on its own now and then.
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 ||
            gh release create "$TAG" --verify-tag --generate-notes --title "$TAG"
          for file in dist/*; do
            for attempt in 1 2 3 4; do
              if gh release upload "$TAG" "$file" --clobber; then
                echo "uploaded $(basename "$file")"
                break
              fi
              [ "$attempt" -lt 4 ] || { echo "giving up on $file"; exit 1; }
              sleep $((attempt * 5))
            done
          done
      - name: The release has all eight
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$TAG" --json assets --jq '.assets[] | "\(.size)\t\(.name)"'
          test "$(gh release view "$TAG" --json assets --jq '.assets | length')" -eq 8

  crate:
    # Publishes to crates.io when the repository has a CARGO_REGISTRY_TOKEN
    # secret (a crates.io API token with publish-new and publish-update);
    # without one the job says so and succeeds.
    needs: [publish, manifest]
    # `manifest` is skipped when a tag is published again by hand; a skipped
    # need would otherwise skip this job too.
    if: ${{ !cancelled() && needs.publish.result == 'success' && (needs.manifest.result == 'success' || needs.manifest.result == 'skipped') }}
    runs-on: ubuntu-latest
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
      - name: No token, no publish
        if: env.CARGO_REGISTRY_TOKEN == ''
        run: echo "CARGO_REGISTRY_TOKEN is not set; skipping crates.io"
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        if: env.CARGO_REGISTRY_TOKEN != ''
        with:
          toolchain: ${{ env.RUST }}
      - name: Publish
        if: env.CARGO_REGISTRY_TOKEN != ''
        # crates.io versions are permanent, so publishing twice is an error.
        # Ask first, which makes running this workflow again harmless.
        run: |
          VERSION=${TAG#v}
          if curl -fsS -o /dev/null -A "background-remover release workflow" \
              "https://crates.io/api/v1/crates/background-remover-server/$VERSION"; then
            echo "background-remover-server $VERSION is already on crates.io"
          else
            cargo publish --locked
          fi

  tap:
    # Rewrites the Homebrew formula in daniel-oh/homebrew-tap from the
    # checksums this release produced. Needs a TAP_TOKEN secret: a
    # fine-grained token with contents read/write on that one repository.
    needs: [publish]
    runs-on: ubuntu-latest
    env:
      TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
      - name: No token, no formula update
        if: env.TAP_TOKEN == ''
        run: echo "TAP_TOKEN is not set; run scripts/formula.sh by hand"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.TAP_TOKEN != ''
        with:
          repository: daniel-oh/homebrew-tap
          token: ${{ secrets.TAP_TOKEN }}
          path: tap
      - name: Fetch the checksums
        if: env.TAP_TOKEN != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$TAG" --pattern '*.sha256' --dir sums
      - name: Update the formula
        if: env.TAP_TOKEN != ''
        run: |
          VERSION=${TAG#v}
          scripts/formula.sh "$VERSION" sums > tap/Formula/background-remover.rb
          cd tap
          git config user.name "Daniel Oh"
          git config user.email "daniel-oh@users.noreply.github.com"
          git add Formula/background-remover.rb
          # Nothing to commit when the formula is already current (a re-run).
          git diff --cached --quiet || { git commit -m "background-remover $VERSION" && git push; }
