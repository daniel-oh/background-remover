name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: every job only reads the repository, except `audit`,
# which asks for what it needs below.
#
# Every action is pinned to a commit, with its release in a comment. A tag
# can be moved to different code after the fact (it has happened to
# widely used actions); a commit cannot. Dependabot raises both together.
permissions:
  contents: read

env:
  MODEL_URL: https://github.com/danielgatis/rembg/releases/download/v0.0.0/isnet-general-use.onnx
  MODEL_SHA256: 60920e99c45464f2ba57bee2ad08c919a52bbf852739e96947fbb4358c0d964a

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: "1.100"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Cache the model
        id: model
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .model/isnet-general-use.onnx
          key: isnet-general-use-${{ env.MODEL_SHA256 }}
      - name: Fetch the model
        if: steps.model.outputs.cache-hit != 'true'
        run: |
          mkdir -p .model
          curl -sSL -o .model/isnet-general-use.onnx "$MODEL_URL"
      - name: Check the model
        run: echo "$MODEL_SHA256  .model/isnet-general-use.onnx" | sha256sum -c -
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Docs build without warnings
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --locked
      - name: Test, with the golden parity check on both fixtures
        env:
          MODEL_PATH: ${{ github.workspace }}/.model/isnet-general-use.onnx
        run: |
          cargo test --release --locked
          GOLDEN=jpeg cargo test --release --locked --test golden
      - name: Smoke-test the built binary (a corrupt JPEG must not kill it)
        env:
          MODEL_PATH: ${{ github.workspace }}/.model/isnet-general-use.onnx
        run: |
          cargo build --release --locked
          scripts/smoke.sh target/release/background-remover
      - name: The crate packages and builds as published
        if: runner.arch == 'X64'
        run: cargo package --locked

  test-arm64:
    # The same suite on a 64-bit Arm runner: the model, the resampler and the
    # decoders all have architecture-specific paths.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: "1.100"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Cache the model
        id: model
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .model/isnet-general-use.onnx
          key: isnet-general-use-${{ env.MODEL_SHA256 }}
      - name: Fetch the model
        if: steps.model.outputs.cache-hit != 'true'
        run: |
          mkdir -p .model
          curl -sSL -o .model/isnet-general-use.onnx "$MODEL_URL"
      - name: Test
        env:
          MODEL_PATH: ${{ github.workspace }}/.model/isnet-general-use.onnx
        run: |
          cargo test --release --locked
          GOLDEN=jpeg cargo test --release --locked --test golden
      - name: Smoke-test the built binary (a corrupt JPEG must not kill it)
        env:
          MODEL_PATH: ${{ github.workspace }}/.model/isnet-general-use.onnx
        run: |
          cargo build --release --locked
          scripts/smoke.sh target/release/background-remover
      - name: The crate packages and builds as published
        if: runner.arch == 'X64'
        run: cargo package --locked

  platforms:
    # Windows and macOS, where release.yml builds binaries. Without this job
    # a release was the first time either was compiled: v0.4.0's Windows
    # binary failed to build at release time on a change that had passed
    # every check here. Builds, runs the whole suite with the real model,
    # and runs the binary as a process on a photo.
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-latest, macos-latest]
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    env:
      MODEL_PATH: ${{ github.workspace }}/.model/isnet-general-use.onnx
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: "1.100"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Cache the model
        id: model
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .model/isnet-general-use.onnx
          key: isnet-general-use-${{ env.MODEL_SHA256 }}
      - name: Fetch the model
        if: steps.model.outputs.cache-hit != 'true'
        run: |
          mkdir -p .model
          curl -sSL -o .model/isnet-general-use.onnx "$MODEL_URL"
      - name: Test (the golden test checks the model's checksum itself)
        run: |
          cargo test --release --locked
          GOLDEN=jpeg cargo test --release --locked --test golden
      - name: The built binary runs, and cuts out a photo
        run: |
          cargo build --release --locked
          target/release/background-remover --version
          target/release/background-remover -o cutout.png testdata/sample.jpg
          test -s cutout.png

  msrv:
    # The oldest Rust the crate claims to build on (Cargo.toml rust-version).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The action at a fixed commit; the Rust release is the input.
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo check --locked --all-targets

  policy:
    # Licences, advisories, duplicate crates and sources (deny.toml), spelling,
    # and the Dockerfile.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@70f81531115945ba6eb6b941ec9d39d063438eb9 # v2.1.2
        with:
          command: check
      # A release tag, not `master`: a moving branch can change what runs here
      # (and break the build) without any change in this repository.
      - uses: crate-ci/typos@53821664afd79bb88fcdd22fdc2f49d8d3f6cac9 # v1
      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile

  audit:
    runs-on: ubuntu-latest
    # audit-check reports an advisory by creating a check run. Without this
    # it found RUSTSEC-2026-0285 and then died on "Resource not accessible by
    # integration", which hid the real message behind a permissions error.
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  image:
    # Builds the container, runs it the way the hardened compose example
    # does and puts a photo through it, then scans it for known
    # vulnerabilities; publishing is release.yml's job. Building alone is
    # not proof: v0.4.0's image built, scanned clean, and held a program
    # that did nothing.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: background-remover:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Cache the model
        id: model
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .model/isnet-general-use.onnx
          key: isnet-general-use-${{ env.MODEL_SHA256 }}
      - name: Fetch the model
        if: steps.model.outputs.cache-hit != 'true'
        run: |
          mkdir -p .model
          curl -sSL -o .model/isnet-general-use.onnx "$MODEL_URL"
      - name: The image runs, and cuts out a photo
        run: |
          chmod -R a+rX .model
          docker run -d --name remover --read-only --cap-drop ALL \
            --security-opt no-new-privileges:true --memory 768m \
            -p 127.0.0.1:7000:7000 -v "$PWD/.model:/models/isnet-general-use:ro" \
            background-remover:ci
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:7000/health >/dev/null && break
            sleep 1
          done
          version=$(docker run --rm background-remover:ci --version)
          echo "$version"
          test "$version" = "background-remover $(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          code=$(curl -s -o cutout.png -w '%{http_code}' --max-time 120 \
            --data-binary @testdata/sample.jpg -H 'content-type: image/jpeg' \
            http://127.0.0.1:7000/remove)
          docker logs remover
          test "$code" = 200
          test "$(head -c 4 cutout.png | od -An -tx1 | tr -d ' \n')" = 89504e47
          test "$(docker inspect remover --format '{{.State.Running}}')" = true
      - name: Scan the image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: background-remover:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
