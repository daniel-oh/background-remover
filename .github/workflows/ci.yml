name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  MODEL_URL: https://github.com/danielgatis/rembg/releases/download/v0.0.0/isnet-general-use.onnx
  MODEL_SHA256: 60920e99c45464f2ba57bee2ad08c919a52bbf852739e96947fbb4358c0d964a

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Cache the model
        id: model
        uses: actions/cache@v6
        with:
          path: .model/isnet-general-use.onnx
          key: isnet-general-use-${{ env.MODEL_SHA256 }}
      - name: Fetch the model
        if: steps.model.outputs.cache-hit != 'true'
        run: |
          mkdir -p .model
          curl -sSL -o .model/isnet-general-use.onnx "$MODEL_URL"
      - name: Check the model
        run: echo "$MODEL_SHA256  .model/isnet-general-use.onnx" | sha256sum -c -
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Docs build without warnings
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --locked
      - name: Test, with the golden parity check on both fixtures
        env:
          MODEL_PATH: ${{ github.workspace }}/.model/isnet-general-use.onnx
        run: |
          cargo test --release --locked
          GOLDEN=jpeg cargo test --release --locked --test golden
      - name: Smoke-test the built binary (a corrupt JPEG must not kill it)
        env:
          MODEL_PATH: ${{ github.workspace }}/.model/isnet-general-use.onnx
        run: |
          cargo build --release --locked
          scripts/smoke.sh target/release/background-remover

  test-arm64:
    # The same suite on a 64-bit Arm runner: the model, the resampler and the
    # decoders all have architecture-specific paths.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98"
      - uses: Swatinem/rust-cache@v2
      - name: Cache the model
        id: model
        uses: actions/cache@v6
        with:
          path: .model/isnet-general-use.onnx
          key: isnet-general-use-${{ env.MODEL_SHA256 }}
      - name: Fetch the model
        if: steps.model.outputs.cache-hit != 'true'
        run: |
          mkdir -p .model
          curl -sSL -o .model/isnet-general-use.onnx "$MODEL_URL"
      - name: Test
        env:
          MODEL_PATH: ${{ github.workspace }}/.model/isnet-general-use.onnx
        run: |
          cargo test --release --locked
          GOLDEN=jpeg cargo test --release --locked --test golden
      - name: Smoke-test the built binary (a corrupt JPEG must not kill it)
        env:
          MODEL_PATH: ${{ github.workspace }}/.model/isnet-general-use.onnx
        run: |
          cargo build --release --locked
          scripts/smoke.sh target/release/background-remover

  msrv:
    # The oldest Rust the crate claims to build on (Cargo.toml rust-version).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked --all-targets

  policy:
    # Licences, advisories, duplicate crates and sources (deny.toml), spelling,
    # and the Dockerfile.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
      - uses: crate-ci/typos@master
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  image:
    # Proves the container builds on every change and scans it for known
    # vulnerabilities; publishing is release.yml's job.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: background-remover:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan the image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: background-remover:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
